<meta charset="utf-8">
<title>정글 픽 도우미</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위에 밴픽 보드(우리 팀 / 상대 팀 두 열), 아래에 조합 요약과 추천 카드 목록 */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --line: #d9ddd6; --fg: #1c211f; --muted: #5c655f;
  --blue: #2b62c9; --blue-soft: #e4ecfb; --red: #c23b32; --red-soft: #f9e5e3;
  --good: #23804f; --bad: #b8402f; --note: #8a6a12; --accent: #1f6f5c;
  --font-display: "Do Hyeon", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141816; --surface: #1c211f; --line: #303834; --fg: #e8ece9; --muted: #9aa49e;
  --blue: #7aa2f0; --blue-soft: #1d2a44; --red: #ef7f75; --red-soft: #3b2120;
  --good: #5fca8f; --bad: #f08a78; --note: #e0bd5c; --accent: #5cc3a6; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #141816; --surface: #1c211f; --line: #303834; --fg: #e8ece9; --muted: #9aa49e;
  --blue: #7aa2f0; --blue-soft: #1d2a44; --red: #ef7f75; --red-soft: #3b2120;
  --good: #5fca8f; --bad: #f08a78; --note: #e0bd5c; --accent: #5cc3a6; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 18px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 2rem; margin: 0; letter-spacing: 0.01em; }
.sub { color: var(--muted); margin: 0; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 6px 12px; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.board { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 720px) { .board { grid-template-columns: 1fr; } }
.team { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.team h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.team h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.team.blue { --c: var(--blue); --soft: var(--blue-soft); }
.team.red { --c: var(--red); --soft: var(--red-soft); }
.slot { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 8px; margin-top: 6px; position: relative; }
.lane { font-size: 0.8rem; letter-spacing: 0.04em; color: var(--muted); }
.slot input { width: 100%; font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.slot input.filled { background: var(--soft); border-color: var(--c); font-weight: 500; }
.slot.me .pick { padding: 7px 10px; border-radius: 8px; border: 1px dashed var(--c); color: var(--c); font-weight: 500; }
.menu { position: absolute; left: 52px; right: 0; top: 100%; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  margin-top: 2px; max-height: 220px; overflow-y: auto; box-shadow: 0 6px 18px rgba(0,0,0,0.12); }
.menu div { padding: 6px 10px; cursor: pointer; }
.menu div[aria-selected="true"], .menu div:hover { background: var(--soft); }
.bans { margin-top: 12px; display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: center; }
.bans input { width: 100%; font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.example { font-size: 0.85rem; color: var(--note); margin: 10px 0 0; }

.summary { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 720px) { .summary { grid-template-columns: 1fr; } }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.box h3 { margin: 0 0 8px; font-size: 0.95rem; color: var(--muted); font-weight: 500; letter-spacing: 0.02em; }
.need { font-family: var(--font-display); font-size: 1.6rem; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 0.82rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-variant-numeric: tabular-nums; }
.chip.warn { border-color: var(--bad); color: var(--bad); }

h2.sec { font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; margin: 28px 0 10px; }
.recs { display: grid; gap: 10px; }
.rec { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 2.2rem 1fr; gap: 4px 12px; min-width: 0; }
.rank { font-family: var(--font-display); font-size: 1.5rem; color: var(--muted); line-height: 1; padding-top: 2px; }
.rec.top .rank { color: var(--accent); }
.rec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.rec-name { font-weight: 700; font-size: 1.1rem; }
.score { font-variant-numeric: tabular-nums; font-weight: 700; }
.score.pos { color: var(--good); } .score.neg { color: var(--bad); }
.meta { color: var(--muted); font-size: 0.85rem; }
.bar { grid-column: 2; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
.reasons { grid-column: 2; list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 2px; font-size: 0.9rem; }
.reasons li { padding-left: 1.2em; text-indent: -1.2em; overflow-wrap: anywhere; }
.reasons .p::before { content: "+ "; color: var(--good); font-weight: 700; }
.reasons .m::before { content: "− "; color: var(--bad); font-weight: 700; }
.reasons .n::before { content: "• "; color: var(--note); font-weight: 700; }
.more { margin-top: 10px; }
.empty { color: var(--muted); }
footer { margin-top: 32px; color: var(--muted); font-size: 0.85rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>정글 픽 도우미</h1>
      <p class="sub">우리 팀과 상대 팀을 넣으면 내 정글 챔피언 중 무엇을 고를지 추천해요.</p>
    </div>
    <div class="toolbar">
      <button id="btn-example" type="button">예시 불러오기</button>
      <button id="btn-clear" type="button">모두 지우기</button>
    </div>
  </header>

  <section class="board" aria-label="밴픽">
    <div class="team blue"><h2>우리 팀</h2><div id="ally"></div></div>
    <div class="team red"><h2>상대 팀</h2><div id="enemy"></div>
      <div class="bans"><span class="lane">밴</span><input id="bans" placeholder="밴된 챔피언 (쉼표로 구분)" autocomplete="off"></div>
    </div>
  </section>
  <p class="example" id="example-note" hidden>지금 보이는 건 예시 조합이에요. 칸을 고쳐서 실제 밴픽을 넣으세요.</p>

  <section class="summary" aria-label="조합 요약">
    <div class="box"><h3>우리 팀이 필요한 정글</h3><p class="need" id="need">-</p><div class="meta" id="need-why"></div><div class="chips" id="ally-chips"></div></div>
    <div class="box"><h3>상대 조합</h3><div class="chips" id="enemy-chips"></div></div>
  </section>

  <h2 class="sec">추천</h2>
  <div class="recs" id="recs"></div>
  <button class="more" id="btn-more" type="button" hidden>나머지 보기</button>

  <footer>숙련도 2 이상인 내 챔피언만 추천해요. 점수는 AD/AP 규칙, 숙련도, 상성, CC 취약도, 챔피언별 규칙을 합친 값이에요.</footer>
</div>

<script>
// 정글 추천 엔진
// 브라우저와 Node 양쪽에서 쓴다. data는 web/data.json (scripts/export_web.py로 생성).
//
// 입력
//   ally : 우리 팀 [{name, lane}] (정글 제외, 라인은 탑/미드/원딜/서폿)
//   enemy: 상대 팀 [{name, lane}] (정글 포함 가능, 덜 골라도 됨)
// 출력
//   { ally: 우리 조합 분석, enemy: 상대 조합 분석, apNeed: AD/AP 판단, recs: 추천 목록 }
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.JungleEngine = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  const LANES = ["탑", "정글", "미드", "원딜", "서폿"];
  const ONE_V_ONE_STRONG = ["다리우스", "이렐리아", "올라프", "피오라", "잭스", "트린다미어", "세트", "레넥톤", "일라오이"];
  const STEALTH = ["이블린", "트위치", "샤코", "아칼리", "렝가", "카직스", "티모", "파이크", "케인"];
  const FEAR_IGNORE = ["오른", "올라프", "사이온", "문도 박사", "워윅", "볼리베어"];
  const ASSASSIN_JUNGLE = ["나피리", "카직스", "이블린", "에코", "다이애나", "녹턴"];
  const CHASE_LONG = ["렉사이", "바이"];
  const SHORT_CHASE = ["나피리"];

  function dmgOf(data, p) {
    const c = data.champions[p.name];
    if (!c) return "AD";
    return (c.damageByLane && c.damageByLane[p.lane]) || c.damage;
  }

  function apValue(cls) {
    if (cls === "AP" || cls === "혼합") return 1;
    if (cls === "반AP") return 0.5;
    return 0;
  }

  function isTank(cls) {
    return cls.endsWith("탱커") || cls === "반AP";
  }

  // ---------- 조합 분석 ----------

  function analyzeAlly(data, ally) {
    const byLane = {};
    ally.forEach((p) => (byLane[p.lane] = p));
    const mid = byLane["미드"];
    const midCls = mid ? dmgOf(data, mid) : "AP"; // 안 골랐으면 AP로 가정
    const others = ally.filter((p) => p.lane !== "미드");
    const apOthers = others.reduce((s, p) => s + apValue(dmgOf(data, p)), 0);

    let need, why;
    if (midCls === "AP") {
      need = "AD";
      why = mid ? `미드 ${mid.name}가 AP` : "미드가 아직 안 골라서 AP로 가정";
    } else if (apOthers >= 2) {
      need = "AD";
      why = `미드를 뺀 AP·혼합이 ${apOthers}명`;
    } else if (apOthers >= 1) {
      need = "혼합또는AP";
      why = `미드 ${mid.name}가 AD이고 미드를 뺀 AP가 ${apOthers}명`;
    } else {
      need = "AP";
      why = `미드 ${mid ? mid.name : ""}가 AD이고 미드를 뺀 AP가 없음`;
    }

    const tanks = ally.filter((p) => isTank(dmgOf(data, p)));
    const engage = ally.filter((p) => (data.cc[p.name] || []).some((c) => c.use.includes("이니시")));
    const adc = byLane["원딜"];
    const adcIsMage = adc ? dmgOf(data, adc) === "AP" : false;
    const carries = ally.filter((p) => p.lane !== "서폿" && !isTank(dmgOf(data, p)));
    const yasuo = ally.some((p) => p.name === "야스오");

    return { midCls, apOthers, need, why, tanks, engage, adcIsMage, carries, yasuo, byLane, count: ally.length };
  }

  function analyzeEnemy(data, enemy) {
    const byLane = {};
    enemy.forEach((p) => (byLane[p.lane] = p));
    const ccList = [];
    enemy.forEach((p) => (data.cc[p.name] || []).forEach((c) => ccList.push({ ...c, champ: p.name, lane: p.lane })));
    const wild = data.wildcards.filter((w) => enemy.some((p) => p.name === w.champ));
    const cls = enemy.map((p) => ({ p, cls: dmgOf(data, p) }));
    const dealers = cls.filter((x) => !isTank(x.cls));
    const adCount = cls.filter((x) => x.cls === "AD").length;
    const autoCount = enemy.filter((p) => data.champions[p.name] && data.champions[p.name].auto).length;
    const allAD = dealers.length > 0 && dealers.every((x) => x.cls === "AD");
    const tanks = cls.filter((x) => isTank(x.cls)).map((x) => x.p.name);
    const highHp = enemy.filter((p) => data.highHpTanks.includes(p.name)).map((p) => p.name);
    const protectors = enemy.filter((p) => data.protectors[p.name]).map((p) => ({ name: p.name, tier: data.protectors[p.name] }));
    const stealth = enemy.filter((p) => STEALTH.includes(p.name)).map((p) => p.name);
    const longMobility = enemy.filter((p) => (data.selfSurvival[p.name] || []).includes("거리가 먼 이동기")).map((p) => p.name);
    const adc = byLane["원딜"];
    const adcIsMage = adc ? dmgOf(data, adc) === "AP" : false;
    const shapes = {};
    ccList.forEach((c) => (shapes[c.shape] = (shapes[c.shape] || 0) + 1));
    return {
      byLane, ccList, wild, adCount, autoCount, allAD, tanks, highHp, protectors, stealth, longMobility, adcIsMage, shapes,
      jungle: byLane["정글"], count: enemy.length,
    };
  }

  // ---------- 위험한 CC 세기 ----------

  function dangerTokens(pool) {
    return (pool.dangerCC || "").split(",").map((s) => s.trim()).filter(Boolean);
  }

  function countDangerCC(data, name, pool, E) {
    const tokens = dangerTokens(pool);
    const hits = [];
    const add = (label, list) => list.forEach((x) => hits.push(`${x.champ} ${x.key || x.skill}`.trim() + ` (${label})`));
    const cc = E.ccList;
    if (!tokens.length) tokens.push("확정");
    tokens.forEach((t) => {
      if (t === "광역지연") add("광역지연", cc.filter((c) => c.shape === "광역지연"));
      else if (t === "직선") add("직선", cc.filter((c) => c.shape === "직선"));
      else if (t === "확정") add("확정", cc.filter((c) => c.shape === "확정"));
      else if (t === "바로 걸리는 확정") add("바로 걸리는 확정", cc.filter((c) => c.shape === "확정" && !c.dodge));
      else if (t === "근접 광역") add("근접 광역", cc.filter((c) => c.shape === "광역즉시"));
      else if (t === "근접 확정") add("근접 확정", cc.filter((c) => c.shape === "확정" && !c.dodge));
      else if (t === "한 명 물기 좋은 스킬")
        add("한 명 물기", cc.filter((c) => c.target === "단일" && c.use.includes("잡기") && c.shape !== "확정"));
      else if (t === "이동기 봉쇄" || t === "평타 무력화")
        E.wild.filter((w) => w.type === t).forEach((w) => hits.push(`${w.champ} ${w.skill} (${t})`));
    });
    (pool.extraDanger || []).forEach((s) => {
      const c = cc.find((x) => `${x.champ} ${x.key}` === s);
      if (c) hits.push(`${s} (직접 지정)`);
    });
    // 같은 스킬이 두 번 세지지 않게 "챔피언 키" 기준으로 합친다
    const seen = new Set();
    return hits.filter((h) => {
      const k = h.split(" (")[0];
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  }

  // ---------- 점수 ----------

  function scoreChampion(data, name, A, E) {
    const pool = data.pool[name];
    const pick = data.picks[name] || {};
    const champ = data.champions[name];
    const pros = [], cons = [], notes = [];
    let score = 0;
    const plus = (n, why) => { score += n; pros.push(why); };
    const minus = (n, why) => { score -= n; cons.push(why); };

    // 숙련도
    score += { 4: 4, 3: 2, 2: -1 }[pool.prof] || 0;
    if (pool.rare) minus(1, "잘 쓰지만 평소에 자주 안 꺼내는 챔피언");

    // AD/AP
    const d = pool.damage;
    const table = {
      AD: { AD: 3, 혼합: 0, AP: -3, AP탱커: -1, 반AP: -1 },
      AP: { AP: 3, 혼합: -1, AD: -3, AP탱커: -1, 반AP: 1 },
      혼합또는AP: { AP: 3, 혼합: 3, AD: -2, AP탱커: -1, 반AP: 1 },
    };
    const ap = (table[A.need] || {})[d] || 0;
    if (ap > 0) plus(ap, `${A.need === "혼합또는AP" ? "혼합 딜이나 AP" : A.need} 정글이 필요한 조합 (${A.why})`);
    else if (ap < 0) minus(-ap, `${A.need === "혼합또는AP" ? "혼합 딜이나 AP" : A.need} 정글이 필요한데 ${d} (${A.why})`);

    // 상성
    const bad = pick["상성_불리"] || [], good = pick["상성_유리"] || [];
    Object.values(E.byLane).forEach((p) => {
      const isJg = p.lane === "정글";
      if (bad.includes(p.name)) minus(isJg ? 4 : 1.5, `상성 불리: ${p.name}${isJg ? " (상대 정글)" : ""}`);
      if (good.includes(p.name)) plus(isJg ? 3 : 1, `상성 유리: ${p.name}${isJg ? " (상대 정글)" : ""}`);
    });

    // CC 취약도
    if (pool.vuln) {
      const hits = countDangerCC(data, name, pool, E);
      const limit = { 높음: 2, 중간: 3, 낮음: 5 }[pool.vuln];
      if (hits.length >= limit) minus(3 + (hits.length - limit), `CC 취약도 ${pool.vuln}인데 위험한 CC ${hits.length}개: ${hits.join(", ")}`);
      else if (hits.length === limit - 1 && hits.length > 0) minus(1, `위험한 CC ${hits.length}개: ${hits.join(", ")}`);
    }

    // 평타 무력화 (평타 위주 챔피언)
    if (champ && champ.auto && !dangerTokens(pool).includes("평타 무력화")) {
      const aa = E.wild.filter((w) => w.type === "평타 무력화");
      if (aa.length) minus(1.5 * aa.length, `평타 위주인데 평타 무력화: ${aa.map((w) => `${w.champ} ${w.skill}`).join(", ")}`);
    }

    // 우리 팀 부족한 것
    const myCC = data.cc[name] || [];
    if (A.count >= 3 && A.tanks.length === 0 && (pool.damage.endsWith("탱커") || pool.damage === "반AP" || name === "볼리베어"))
      plus(2, "우리 팀에 앞라인이 없음");
    if (A.count >= 3 && A.engage.length === 0 && myCC.some((c) => c.use.includes("이니시")))
      plus(2, "우리 팀에 이니시가 없음");

    // 암살·돌진 정글 공통
    if (ASSASSIN_JUNGLE.includes(name)) {
      const top = E.protectors.filter((p) => p.tier === "최상");
      if (top.length) minus(3, `상대에 보호력 최상 서폿: ${top.map((p) => p.name).join(", ")}`);
      if (E.tanks.length >= 2) minus(2, `상대에 탱커 ${E.tanks.length}명: ${E.tanks.join(", ")}`);
      if (E.highHp.length) minus(1, `체력이 매우 높은 탱커: ${E.highHp.join(", ")}`);
    }

    // 고르는 시점: 상대를 보고 고르는 챔피언은 상대가 덜 나왔을 때 점수를 낮춘다
    const when = pick["시점"] || "";
    if (E.count < 3 && /보고/.test(when) && !/빨리|무난/.test(when))
      minus(1.5, `상대를 보고 고르는 챔피언인데 아직 상대가 ${E.count}명만 나옴`);

    // 챔피언별 규칙
    const R = RULES[name];
    if (R) R({ data, A, E, plus, minus, notes, pool });

    return { name, score: Math.round(score * 10) / 10, prof: pool.prof, damage: pool.damage, pros, cons, notes };
  }

  const RULES = {
    "브라이어": ({ E, minus, pool }) => {
      if (!E.byLane["미드"] || !E.byLane["원딜"]) minus(2, "상대 미드와 원딜이 나온 뒤에 고르는 챔피언 (아직 안 나옴)");
      const extra = pool.extraDanger || [];
      ["미드", "원딜"].forEach((l) => {
        const p = E.byLane[l];
        if (!p) return;
        E.ccList.filter((c) => c.champ === p.name && (c.shape === "광역지연" || extra.includes(`${c.champ} ${c.key}`))).forEach((c) =>
          minus(3, `상대 ${l} ${p.name} ${c.key}: W로 못 피하는 CC (브라이어 핵심 카운터)`));
      });
    },
    "그레이브즈": ({ A, E, plus }) => {
      if (A.adcIsMage) plus(3, "우리 원딜이 비원딜이라 그레이브즈가 원딜 역할을 대신함");
      if (E.allAD && A.carries.length <= 1 && A.count >= 3) plus(2, "상대가 전원 AD이고 우리 팀 딜러가 부족함 (E 방어력 중첩)");
      if (A.count >= 3 && A.carries.length <= 1) plus(1, "우리 팀에 캐리할 챔피언이 부족함");
    },
    "나피리": ({ E, minus }) => {
      if (E.longMobility.length) minus(1.5, `거리가 먼 이동기는 못 따라감: ${E.longMobility.join(", ")}`);
    },
    "녹턴": ({ E, plus, notes }) => {
      const adc = E.byLane["원딜"];
      if (!adc) notes.push("상대 바텀을 보고 고르는 챔피언");
      else if (!E.tanks.includes(adc.name)) plus(1, `상대 원딜 ${adc.name}를 R로 노릴 수 있음`);
    },
    "비에고": ({ data, E, minus }) => {
      const strong = Object.values(E.byLane).filter((p) => ONE_V_ONE_STRONG.includes(p.name));
      const assassins = Object.values(E.byLane).filter((p) => data.champions[p.name] && /암살/.test(data.champions[p.name].role));
      if (strong.length) minus(5, `1:1 체급이 매우 높은 챔피언이 있으면 못 꺼냄: ${strong.map((p) => p.name).join(", ")}`);
      if (assassins.length) minus(5, `상대 암살자가 있으면 못 꺼냄: ${assassins.map((p) => p.name).join(", ")}`);
    },
    "다이애나": ({ A, E, plus, minus }) => {
      if (A.yasuo) plus(3, "우리 편 야스오와 R 에어본 연계");
      if (E.tanks.length >= 2) minus(3, "다이애나는 탱커를 심각하게 못 잡음");
    },
    "그웬": ({ E, plus }) => {
      if (E.tanks.length >= 2) plus(3, `상대 탱커 ${E.tanks.length}명 (최대 체력 % 피해)`);
      if (E.highHp.length) plus(1, `체력 높은 탱커: ${E.highHp.join(", ")}`);
    },
    "피들스틱": ({ E, plus, minus }) => {
      if (E.stealth.length) plus(2, `은신 챔피언을 잘 잡음: ${E.stealth.join(", ")}`);
      const kb = E.ccList.filter((c) => /넉백/.test(c.kind));
      if (kb.length) minus(Math.min(3, kb.length), `R을 끊는 넉백: ${kb.map((c) => `${c.champ} ${c.key}`).join(", ")}`);
      const fi = Object.values(E.byLane).filter((p) => FEAR_IGNORE.includes(p.name));
      if (fi.length) minus(fi.length, `공포가 잘 안 통함: ${fi.map((p) => p.name).join(", ")}`);
    },
    "헤카림": ({ E, plus }) => {
      if (E.adcIsMage) plus(3, "상대 원딜이 비원딜이라 카이팅이 약함");
    },
    "람머스": ({ E, plus }) => {
      if (Object.values(E.byLane).some((p) => p.name === "마스터 이")) plus(6, "상대 마스터 이가 있으면 바로 람머스");
      if (E.adCount >= 4 && E.autoCount >= 3) plus(5, `상대 AD ${E.adCount}명, 평타 위주 ${E.autoCount}명`);
    },
    "말파이트": ({ E, plus }) => {
      if (E.allAD && E.autoCount < 3 && E.count >= 3) plus(4, `상대 전원 AD인데 평타 위주는 ${E.autoCount}명 (람머스 대신)`);
    },
    "사일러스": ({ data, E, plus, minus }) => {
      const good = Object.values(E.byLane).filter((p) => data.champions[p.name] && data.champions[p.name].sylasUlt);
      if (good.length >= 2) plus(3, `빼앗기 좋은 궁극기 ${good.length}개: ${good.map((p) => p.name).join(", ")}`);
      else if (E.count >= 4) minus(2, "빼앗기 좋은 궁극기가 부족함");
    },
    "볼리베어": ({ A, plus }) => {
      if (A.count >= 3 && A.tanks.length === 0) plus(2, "우리 팀에 탱커가 필요함");
    },
    "바이": ({ E, plus }) => {
      if (E.longMobility.length) plus(1, `거리가 먼 이동기도 따라감: ${E.longMobility.join(", ")}`);
    },
    "렉사이": ({ E, plus }) => {
      if (E.longMobility.length) plus(1, `거리가 먼 이동기도 따라감: ${E.longMobility.join(", ")}`);
      if (E.stealth.length) plus(1, `진동 감지로 은신을 찾음: ${E.stealth.join(", ")}`);
    },
  };

  function recommend(data, ally, enemy, opts) {
    opts = opts || {};
    const minProf = opts.minProf || 2;
    const bans = new Set(opts.bans || []);
    const taken = new Set([...ally, ...enemy].map((p) => p.name));
    const A = analyzeAlly(data, ally);
    const E = analyzeEnemy(data, enemy);
    const recs = Object.keys(data.pool)
      .filter((n) => data.pool[n].prof >= minProf && !taken.has(n) && !bans.has(n))
      .map((n) => scoreChampion(data, n, A, E))
      .sort((a, b) => b.score - a.score || b.prof - a.prof);
    return { ally: A, enemy: E, recs };
  }

  return { recommend, analyzeAlly, analyzeEnemy, dmgOf, LANES };
});

</script>
<script>
(function () {
  "use strict";
  const ALLY_LANES = ["탑", "정글", "미드", "원딜", "서폿"];
  const EXAMPLE = {
    ally: { 탑: "가렌", 미드: "제드", 원딜: "징크스", 서폿: "레오나" },
    enemy: { 탑: "피오라", 정글: "마스터 이", 미드: "야스오", 원딜: "베인", 서폿: "파이크" },
    bans: "리 신",
  };
  const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
  const chosung = (s) => [...s].map((ch) => {
    const c = ch.charCodeAt(0) - 0xac00;
    return c >= 0 && c < 11172 ? CHO[Math.floor(c / 588)] : ch;
  }).join("");

  let DATA = null, NAMES = [], showAll = false, isExample = false;
  const state = { ally: {}, enemy: {}, bans: "" };

  const save = () => { try { localStorage.setItem("jungle-draft", JSON.stringify(state)); } catch (e) {} };
  const load = () => { try { return JSON.parse(localStorage.getItem("jungle-draft") || "null"); } catch (e) { return null; } };

  function search(q) {
    q = q.trim().replace(/\s/g, "");
    if (!q) return [];
    return NAMES.filter((n) => {
      const flat = n.replace(/\s/g, "");
      return flat.includes(q) || chosung(flat).includes(q);
    }).slice(0, 8);
  }

  function makeSlot(side, lane) {
    const wrap = document.createElement("div");
    wrap.className = "slot";
    const label = document.createElement("span");
    label.className = "lane";
    label.textContent = lane;
    wrap.appendChild(label);
    if (side === "ally" && lane === "정글") {
      wrap.classList.add("me");
      const me = document.createElement("div");
      me.className = "pick";
      me.textContent = "나 (추천 받을 자리)";
      wrap.appendChild(me);
      return wrap;
    }
    const input = document.createElement("input");
    input.id = `${side}-${lane}`;
    input.placeholder = "챔피언 이름이나 초성";
    input.autocomplete = "off";
    input.setAttribute("aria-label", `${side === "ally" ? "우리" : "상대"} ${lane}`);
    const menu = document.createElement("div");
    menu.className = "menu";
    menu.hidden = true;
    let items = [], active = 0;
    const commit = (name) => {
      input.value = name;
      state[side][lane] = name;
      menu.hidden = true;
      onChange();
    };
    const render = () => {
      menu.innerHTML = "";
      items.forEach((n, i) => {
        const d = document.createElement("div");
        d.textContent = n;
        d.setAttribute("aria-selected", i === active ? "true" : "false");
        d.addEventListener("mousedown", (e) => { e.preventDefault(); commit(n); });
        menu.appendChild(d);
      });
      menu.hidden = items.length === 0;
    };
    input.addEventListener("input", () => {
      items = search(input.value); active = 0; render();
      if (!input.value.trim()) { delete state[side][lane]; onChange(); }
    });
    input.addEventListener("keydown", (e) => {
      if (menu.hidden) return;
      if (e.key === "ArrowDown") { active = Math.min(items.length - 1, active + 1); render(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { active = Math.max(0, active - 1); render(); e.preventDefault(); }
      else if (e.key === "Enter") { if (items[active]) commit(items[active]); e.preventDefault(); }
      else if (e.key === "Escape") { menu.hidden = true; }
    });
    input.addEventListener("blur", () => {
      menu.hidden = true;
      const exact = NAMES.find((n) => n.replace(/\s/g, "") === input.value.trim().replace(/\s/g, ""));
      if (exact) commit(exact);
      else if (input.value.trim() && !NAMES.includes(state[side][lane])) { delete state[side][lane]; onChange(); }
    });
    wrap.appendChild(input);
    wrap.appendChild(menu);
    return wrap;
  }

  function fillInputs() {
    for (const side of ["ally", "enemy"]) for (const lane of ALLY_LANES) {
      const el = document.getElementById(`${side}-${lane}`);
      if (el) el.value = state[side][lane] || "";
    }
    document.getElementById("bans").value = state.bans || "";
    refreshFilled();
  }

  function refreshFilled() {
    document.querySelectorAll(".slot input").forEach((el) => el.classList.toggle("filled", NAMES.includes(el.value)));
  }

  function chip(text, warn) {
    const s = document.createElement("span");
    s.className = "chip" + (warn ? " warn" : "");
    s.textContent = text;
    return s;
  }

  function onChange(fromUser = true) {
    if (fromUser && isExample) { isExample = false; document.getElementById("example-note").hidden = true; }
    refreshFilled();
    save();
    const ally = Object.entries(state.ally).filter(([l, n]) => l !== "정글" && NAMES.includes(n)).map(([lane, name]) => ({ lane, name }));
    const enemy = Object.entries(state.enemy).filter(([, n]) => NAMES.includes(n)).map(([lane, name]) => ({ lane, name }));
    const bans = (state.bans || "").split(/[,\s]+/).map((s) => s.trim()).filter(Boolean)
      .map((b) => NAMES.find((n) => n.replace(/\s/g, "") === b.replace(/\s/g, ""))).filter(Boolean);
    const r = JungleEngine.recommend(DATA, ally, enemy, { bans });

    const needText = { AD: "AD 정글", AP: "AP 정글", 혼합또는AP: "혼합 딜 또는 AP 정글" }[r.ally.need];
    document.getElementById("need").textContent = needText;
    document.getElementById("need-why").textContent = r.ally.why;
    const ac = document.getElementById("ally-chips"); ac.innerHTML = "";
    if (ally.length >= 3) {
      ac.appendChild(chip(`앞라인 ${r.ally.tanks.length}명`, r.ally.tanks.length === 0));
      ac.appendChild(chip(`이니시 ${r.ally.engage.length}명`, r.ally.engage.length === 0));
      ac.appendChild(chip(`딜러 ${r.ally.carries.length}명`, r.ally.carries.length <= 1));
    }
    if (r.ally.adcIsMage) ac.appendChild(chip("우리 원딜이 비원딜"));
    if (r.ally.yasuo) ac.appendChild(chip("야스오 에어본 연계"));

    const ec = document.getElementById("enemy-chips"); ec.innerHTML = "";
    const E = r.enemy;
    if (!enemy.length) ec.appendChild(chip("아직 상대가 없어요"));
    else {
      ec.appendChild(chip(`${E.count}명 공개`));
      ec.appendChild(chip(`AD ${E.adCount}명`, E.adCount >= 4));
      ec.appendChild(chip(`평타 위주 ${E.autoCount}명`, E.autoCount >= 3));
      if (E.tanks.length) ec.appendChild(chip(`탱커 ${E.tanks.join(", ")}`));
      const order = ["확정", "직선", "광역즉시", "광역지연", "지형"];
      order.forEach((s) => { if (E.shapes[s]) ec.appendChild(chip(`${s} CC ${E.shapes[s]}`, s === "확정" && E.shapes[s] >= 3)); });
      E.protectors.forEach((p) => ec.appendChild(chip(`보호 ${p.name} (${p.tier})`, p.tier === "최상")));
      if (E.stealth.length) ec.appendChild(chip(`은신 ${E.stealth.join(", ")}`));
      if (E.adcIsMage) ec.appendChild(chip("상대 원딜이 비원딜"));
      E.wild.forEach((w) => ec.appendChild(chip(`${w.champ} ${w.skill}: ${w.type}`)));
    }

    const box = document.getElementById("recs"); box.innerHTML = "";
    const list = showAll ? r.recs : r.recs.slice(0, 6);
    const max = Math.max(1, ...r.recs.map((x) => x.score));
    list.forEach((x, i) => {
      const card = document.createElement("article");
      card.className = "rec" + (i < 3 ? " top" : "");
      const pct = Math.max(0, Math.min(100, (x.score / max) * 100));
      card.innerHTML = `<div class="rank">${i + 1}</div>
        <div class="rec-head"><span class="rec-name"></span>
          <span class="score ${x.score >= 0 ? "pos" : "neg"}">${x.score > 0 ? "+" : ""}${x.score}</span>
          <span class="meta">숙련도 ${x.prof} · ${x.damage}</span></div>
        <div class="bar"><span style="width:${pct}%"></span></div>
        <ul class="reasons"></ul>`;
      card.querySelector(".rec-name").textContent = x.name;
      const ul = card.querySelector(".reasons");
      const add = (cls, t) => { const li = document.createElement("li"); li.className = cls; li.textContent = t; ul.appendChild(li); };
      x.pros.forEach((t) => add("p", t));
      x.cons.forEach((t) => add("m", t));
      x.notes.forEach((t) => add("n", t));
      if (!ul.children.length) add("n", "특별한 장단점 없음 (숙련도만 반영)");
      box.appendChild(card);
    });
    if (!r.recs.length) box.innerHTML = '<p class="empty">추천할 챔피언이 없어요.</p>';
    const more = document.getElementById("btn-more");
    more.hidden = r.recs.length <= 6;
    more.textContent = showAll ? "상위 6명만 보기" : `나머지 ${r.recs.length - 6}명 보기`;
  }

  function setExample() {
    state.ally = { ...EXAMPLE.ally }; state.enemy = { ...EXAMPLE.enemy }; state.bans = EXAMPLE.bans;
    isExample = true; document.getElementById("example-note").hidden = false;
    fillInputs(); onChange(false);
  }

  async function start() {
    const res = await fetch("data.json");
    DATA = await res.json();
    NAMES = Object.keys(DATA.champions).sort((a, b) => a.localeCompare(b, "ko"));
    const ally = document.getElementById("ally"), enemy = document.getElementById("enemy");
    ALLY_LANES.forEach((l) => { ally.appendChild(makeSlot("ally", l)); enemy.appendChild(makeSlot("enemy", l)); });
    document.getElementById("bans").addEventListener("input", (e) => { state.bans = e.target.value; onChange(); });
    document.getElementById("btn-example").addEventListener("click", setExample);
    document.getElementById("btn-clear").addEventListener("click", () => {
      state.ally = {}; state.enemy = {}; state.bans = ""; isExample = false;
      document.getElementById("example-note").hidden = true; fillInputs(); onChange(false);
    });
    document.getElementById("btn-more").addEventListener("click", () => { showAll = !showAll; onChange(false); });
    const saved = load();
    if (saved && (Object.keys(saved.ally || {}).length || Object.keys(saved.enemy || {}).length)) {
      Object.assign(state, saved); fillInputs(); onChange(false);
    } else setExample();
  }
  start().catch((e) => {
    document.getElementById("recs").innerHTML = '<p class="empty">데이터를 불러오지 못했어요. 페이지를 새로고침해 주세요.</p>';
    console.error(e);
  });
})();
</script>
