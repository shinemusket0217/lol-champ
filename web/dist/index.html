<meta charset="utf-8">
<title>정글 픽 도우미</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위에 밴픽 보드(우리 팀 / 상대 팀 두 열), 아래에 조합 요약과 추천 카드 목록 */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --line: #d9ddd6; --fg: #1c211f; --muted: #5c655f;
  --blue: #2b62c9; --blue-soft: #e4ecfb; --red: #c23b32; --red-soft: #f9e5e3;
  --good: #23804f; --bad: #b8402f; --note: #8a6a12; --accent: #1f6f5c;
  --font-display: "Do Hyeon", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141816; --surface: #1c211f; --line: #303834; --fg: #e8ece9; --muted: #9aa49e;
  --blue: #7aa2f0; --blue-soft: #1d2a44; --red: #ef7f75; --red-soft: #3b2120;
  --good: #5fca8f; --bad: #f08a78; --note: #e0bd5c; --accent: #5cc3a6; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #141816; --surface: #1c211f; --line: #303834; --fg: #e8ece9; --muted: #9aa49e;
  --blue: #7aa2f0; --blue-soft: #1d2a44; --red: #ef7f75; --red-soft: #3b2120;
  --good: #5fca8f; --bad: #f08a78; --note: #e0bd5c; --accent: #5cc3a6; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 18px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 2rem; margin: 0; letter-spacing: 0.01em; }
.sub { color: var(--muted); margin: 0; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 6px 12px; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.board { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 720px) { .board { grid-template-columns: 1fr; } }
.team { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.team h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.team h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.team.blue { --c: var(--blue); --soft: var(--blue-soft); }
.team.red { --c: var(--red); --soft: var(--red-soft); }
.slot { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 8px; margin-top: 6px; position: relative; }
.lane { font-size: 0.8rem; letter-spacing: 0.04em; color: var(--muted); }
.slot input { width: 100%; font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.slot input.filled { background: var(--soft); border-color: var(--c); font-weight: 500; }
.slot.me .pick { padding: 7px 10px; border-radius: 8px; border: 1px dashed var(--c); color: var(--c); font-weight: 500; }
.menu { position: absolute; left: 52px; right: 0; top: 100%; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  margin-top: 2px; max-height: 220px; overflow-y: auto; box-shadow: 0 6px 18px rgba(0,0,0,0.12); }
.menu div { padding: 6px 10px; cursor: pointer; }
.menu div[aria-selected="true"], .menu div:hover { background: var(--soft); }
.bans { margin-top: 12px; display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: center; }
.bans input { width: 100%; font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.example { font-size: 0.85rem; color: var(--note); margin: 10px 0 0; }
.live { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 0.9rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.live .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.live.on .dot { background: var(--good); }
.live label { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--muted); }

.summary { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 720px) { .summary { grid-template-columns: 1fr; } }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.box h3 { margin: 0 0 8px; font-size: 0.95rem; color: var(--muted); font-weight: 500; letter-spacing: 0.02em; }
.need { font-family: var(--font-display); font-size: 1.6rem; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 0.82rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-variant-numeric: tabular-nums; }
.chip.warn { border-color: var(--bad); color: var(--bad); }
.warns { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 4px; font-size: 0.9rem; }
.warns:empty { display: none; }
.warns li { padding: 6px 10px; border-radius: 8px; border-left: 3px solid var(--k); background: var(--bg); }
.warns b { color: var(--k); margin-right: 4px; }
.w-bad { --k: var(--bad); } .w-warn { --k: var(--note); } .w-note { --k: var(--muted); }

h2.sec { font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; margin: 28px 0 10px; }
.recs { display: grid; gap: 10px; }
.rec { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 2.2rem 1fr; gap: 4px 12px; min-width: 0; }
.rank { font-family: var(--font-display); font-size: 1.5rem; color: var(--muted); line-height: 1; padding-top: 2px; }
.rec.top .rank { color: var(--accent); }
.rec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.rec-name { font-weight: 700; font-size: 1.1rem; }
.score { font-variant-numeric: tabular-nums; font-weight: 700; }
.score.pos { color: var(--good); } .score.neg { color: var(--bad); }
.meta { color: var(--muted); font-size: 0.85rem; }
.bar { grid-column: 2; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
.reasons { grid-column: 2; list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 2px; font-size: 0.9rem; }
.reasons li { padding-left: 1.2em; text-indent: -1.2em; overflow-wrap: anywhere; }
.reasons li { text-indent: 0; padding-left: 0; display: grid; grid-template-columns: 3.4rem 2.6rem 1fr; align-items: baseline; }
.reasons .grp { font-size: 0.75rem; color: var(--muted); }
.reasons .pts { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; padding-right: 6px; }
.reasons .p .pts { color: var(--good); } .reasons .m .pts { color: var(--bad); }
.reasons .n { display: block; color: var(--muted); }
.vetoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.veto { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--bad); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.veto b { margin-right: 8px; }
.veto ul { margin: 4px 0 0; padding-left: 1.1em; font-size: 0.88rem; color: var(--muted); }
.veto li { overflow-wrap: anywhere; }
@media (max-width: 480px) { .reasons li { grid-template-columns: 3rem 2.4rem 1fr; } }
.more { margin-top: 10px; }
.empty { color: var(--muted); }
footer { margin-top: 32px; color: var(--muted); font-size: 0.85rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>정글 픽 도우미</h1>
      <p class="sub">우리 팀과 상대 팀을 넣으면 내 정글 챔피언 중 무엇을 고를지 추천해요.</p>
    </div>
    <div class="toolbar">
      <button id="btn-example" type="button">예시 불러오기</button>
      <button id="btn-clear" type="button">모두 지우기</button>
    </div>
  </header>

  <section class="board" aria-label="밴픽">
    <div class="team blue"><h2>우리 팀</h2><div id="ally"></div></div>
    <div class="team red"><h2>상대 팀</h2><div id="enemy"></div>
      <div class="bans"><span class="lane">밴</span><input id="bans" placeholder="밴된 챔피언 (쉼표로 구분)" autocomplete="off"></div>
    </div>
  </section>
  <p class="example" id="example-note" hidden>지금 보이는 건 예시 조합이에요. 칸을 고쳐서 실제 밴픽을 넣으세요.</p>
  <div class="live" id="live" hidden>
    <span class="dot" id="live-dot"></span><span id="live-text">롤 클라이언트 확인 중</span>
    <label><input type="checkbox" id="live-on" checked> 자동 채우기</label>
  </div>

  <section class="summary" aria-label="조합 요약">
    <div class="box"><h3>우리 조합</h3><p class="need" id="need">-</p><div class="meta" id="need-why"></div>
      <ul class="warns" id="ally-warns"></ul><div class="chips" id="ally-chips"></div></div>
    <div class="box"><h3>상대 조합</h3><div class="chips" id="enemy-chips"></div></div>
  </section>

  <h2 class="sec">추천</h2>
  <div class="recs" id="recs"></div>
  <button class="more" id="btn-more" type="button" hidden>나머지 보기</button>

  <section id="vetoed-sec" hidden>
    <h2 class="sec">이번 판에 피해야 할 챔피언</h2>
    <div class="vetoes" id="vetoed"></div>
  </section>

  <footer>숙련도 2 이상인 내 챔피언만 추천해요. 먼저 절대 금지 조건으로 거르고, 남은 챔피언은 조합에 필요한 것 > 숙련도 > 상대 대응 > 상성 순으로 무게를 둬서 점수를 매겨요.</footer>
</div>

<script>
// 정글 추천 엔진 (2차)
// 브라우저와 Node 양쪽에서 쓴다. data는 web/data.json (scripts/export_web.py로 생성).
//
// 순서
//   1. 절대 금지: data.vetoes 조건에 걸리면 추천에서 빼고 이유를 따로 보여준다
//   2. 점수: 남은 챔피언만. 우선순위가 높은 묶음일수록 무게가 크다
//      조합에 필요한 것 > 숙련도 > 상대 대응 > 상성
//
// 입력
//   ally : 우리 팀 [{name, lane}] (정글 제외)
//   enemy: 상대 팀 [{name, lane}] (덜 골라도 됨)
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.JungleEngine = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  const LANES = ["탑", "정글", "미드", "원딜", "서폿"];
  const STEALTH = ["이블린", "트위치", "샤코", "아칼리", "렝가", "카직스", "티모", "파이크", "케인"];
  const FEAR_IGNORE = ["오른", "올라프", "사이온", "문도 박사", "워윅", "볼리베어"];
  const ASSASSIN_JUNGLE = ["나피리", "카직스", "이블린", "에코", "다이애나", "녹턴"];

  // 점수 무게 (묶음별)
  const W = {
    // 1. 조합에 필요한 것
    apMatch: 4, apMismatch: 4,
    needFrontline: 3, needEngage: 3, needCC: 2, needAntiTank: 3, pureTankWhenAntiTank: 2, needCarry: 1.5,
    // 2. 숙련도
    prof: { 4: 3, 3: 2, 2: 0 }, rare: 1,
    // 3. 상대 대응
    vulnBase: 2, vulnNear: 1, vulnMax: 5, aaNullEach: 1, aaNullMax: 3, timing: 1.5,
    protectorTop: 2, manyTanks: 2, highHp: 1,
    // 4. 상성
    matchJungle: 1.5, matchLane: 0.5,
  };

  const dmgOf = (data, p) => {
    const c = data.champions[p.name];
    if (!c) return "AD";
    return (c.damageByLane && c.damageByLane[p.lane]) || c.damage;
  };
  const apValue = (cls) => (cls === "AP" || cls === "혼합" ? 1 : cls === "반AP" ? 0.5 : 0);
  const isTank = (cls) => cls.endsWith("탱커") || cls === "반AP";
  const champ = (data, n) => data.champions[n] || {};

  // ---------- 조합 분석 ----------

  function analyzeAlly(data, ally) {
    const byLane = {};
    ally.forEach((p) => (byLane[p.lane] = p));
    const mid = byLane["미드"];
    const midCls = mid ? dmgOf(data, mid) : "AP";
    const apOthers = ally.filter((p) => p.lane !== "미드").reduce((s, p) => s + apValue(dmgOf(data, p)), 0);

    let need, why;
    if (midCls === "AP") {
      need = "AD"; why = mid ? `미드 ${mid.name}가 AP` : "미드가 아직 안 골라서 AP로 가정";
    } else if (apOthers >= 2) {
      need = "AD"; why = `미드를 뺀 AP·혼합이 ${apOthers}명`;
    } else if (apOthers >= 1) {
      need = "혼합또는AP"; why = `미드 ${mid.name}가 AD이고 미드를 뺀 AP가 ${apOthers}명`;
    } else {
      need = "AP"; why = `미드 ${mid ? mid.name : ""}가 AD이고 미드를 뺀 AP가 없음`;
    }

    const frontline = ally.filter((p) => champ(data, p.name).frontline);
    const engage = ally.filter((p) => (data.cc[p.name] || []).some((c) => c.use.includes("이니시")));
    const antiTank = ally.filter((p) => champ(data, p.name).antiTank);
    const adc = byLane["원딜"];
    const adcIsMage = adc ? dmgOf(data, adc) === "AP" : false;
    const carries = ally.filter((p) => p.lane !== "서폿" && !isTank(dmgOf(data, p)));
    const yasuo = ally.some((p) => p.name === "야스오");
    const ccList = [];
    ally.forEach((p) => (data.cc[p.name] || []).forEach((c) => ccList.push({ ...c, champ: p.name, lane: p.lane })));
    const shapes = {};
    ccList.forEach((c) => (shapes[c.shape] = (shapes[c.shape] || 0) + 1));
    const dmgCount = { AD: 0, AP: 0, 혼합: 0, 탱커: 0 };
    ally.forEach((p) => {
      const c = dmgOf(data, p);
      if (isTank(c)) dmgCount.탱커 += 1;
      else dmgCount[c] = (dmgCount[c] || 0) + 1;
    });
    const auto = ally.filter((p) => champ(data, p.name).auto);
    return { byLane, count: ally.length, midCls, apOthers, need, why, frontline, engage, antiTank, adcIsMage, carries, yasuo, ccList, shapes, dmgCount, auto };
  }

  function analyzeEnemy(data, enemy) {
    const byLane = {};
    enemy.forEach((p) => (byLane[p.lane] = p));
    const ccList = [];
    enemy.forEach((p) => (data.cc[p.name] || []).forEach((c) => ccList.push({ ...c, champ: p.name, lane: p.lane })));
    const wild = data.wildcards.filter((w) => enemy.some((p) => p.name === w.champ));
    const cls = enemy.map((p) => ({ p, cls: dmgOf(data, p) }));
    const dealers = cls.filter((x) => !isTank(x.cls));
    const shapes = {};
    ccList.forEach((c) => (shapes[c.shape] = (shapes[c.shape] || 0) + 1));
    const catchCC = ccList.filter((c) => ["확정", "직선", "광역즉시"].includes(c.shape) && (c.use.includes("이니시") || c.use.includes("잡기")));
    const adc = byLane["원딜"];
    return {
      byLane, count: enemy.length, ccList, wild, shapes, catchCC,
      adCount: cls.filter((x) => x.cls === "AD").length,
      autoCount: enemy.filter((p) => champ(data, p.name).auto).length,
      allAD: dealers.length > 0 && dealers.every((x) => x.cls === "AD"),
      tanks: cls.filter((x) => isTank(x.cls)).map((x) => x.p.name),
      frontline: enemy.filter((p) => champ(data, p.name).frontline).map((p) => p.name),
      highHp: enemy.filter((p) => data.highHpTanks.includes(p.name)).map((p) => p.name),
      protectors: enemy.filter((p) => data.protectors[p.name]).map((p) => ({ name: p.name, tier: data.protectors[p.name] })),
      stealth: enemy.filter((p) => STEALTH.includes(p.name)).map((p) => p.name),
      longMobility: enemy.filter((p) => (data.selfSurvival[p.name] || []).includes("거리가 먼 이동기")).map((p) => p.name),
      adcIsMage: adc ? dmgOf(data, adc) === "AP" : false,
      assassins: enemy.filter((p) => /암살/.test(champ(data, p.name).role || "")).map((p) => p.name),
      duelists: enemy.filter((p) => data.duelists.includes(p.name)).map((p) => p.name),
      jungle: byLane["정글"],
    };
  }

  // 우리 팀 경고 (3명 이상 골랐을 때)
  function allyWarnings(A, E) {
    const w = [];
    if (A.count < 3) return w;
    if (!A.frontline.length) w.push({ level: "위험", text: "앞라인이 없어요. 탱커나 브루저 정글이 좋아요." });
    if (!A.engage.length) w.push({ level: "위험", text: "한타를 열 이니시가 없어요." });
    if (E.tanks.length && !A.antiTank.length)
      w.push({ level: E.tanks.length >= 2 ? "위험" : "주의", text: `상대 탱커(${E.tanks.join(", ")})를 잡을 챔피언이 없어요. 최대 체력 % 피해나 고정 피해가 있는 정글이 좋아요.` });
    if (A.ccList.length <= 2) w.push({ level: A.ccList.length ? "주의" : "위험", text: `하드 CC가 ${A.ccList.length}개뿐이에요.` });
    if (A.carries.length <= 1) w.push({ level: "주의", text: "딜러가 부족해요. 캐리할 수 있는 정글이 좋아요." });
    if (A.adcIsMage) w.push({ level: "참고", text: "원딜 자리가 비원딜이에요. 원딜 역할을 할 정글이 좋아요." });
    if (A.yasuo) w.push({ level: "참고", text: "야스오가 있어요. 넉업, 넉백, 끌어당김 CC가 있는 정글과 연계돼요." });
    return w;
  }

  // ---------- 1. 절대 금지 ----------

  function unavoidableMidAdc(data, name, E) {
    const extra = (data.pool[name] && data.pool[name].extraDanger) || [];
    const out = [];
    ["미드", "원딜"].forEach((l) => {
      const p = E.byLane[l];
      if (!p) return;
      E.ccList.filter((c) => c.champ === p.name && (c.shape === "광역지연" || extra.includes(`${c.champ} ${c.key}`)))
        .forEach((c) => out.push(`${l} ${p.name} ${c.key}`));
    });
    return out;
  }

  const VETO_RULES = {
    unavoidable_midadc: (data, name, A, E) => {
      const hits = unavoidableMidAdc(data, name, E);
      return hits.length ? hits.join(", ") : null;
    },
    tanks_ge2: (data, name, A, E) => (E.tanks.length >= 2 ? E.tanks.join(", ") : null),
    assassin_or_duelist: (data, name, A, E) => {
      const list = [...new Set([...E.assassins, ...E.duelists])];
      return list.length ? list.join(", ") : null;
    },
    aa_null: (data, name, A, E) => {
      const aa = E.wild.filter((w) => w.type === "평타 무력화");
      return aa.length ? aa.map((w) => `${w.champ} ${w.skill}`).join(", ") : null;
    },
    pick_heavy: (data, name, A, E) => {
      const sure = E.ccList.filter((c) => c.shape === "확정");
      if (sure.length >= 3) return `확정 CC ${sure.length}개: ${sure.map((c) => `${c.champ} ${c.key}`).join(", ")}`;
      if (E.catchCC.length >= 4) return `물기 좋은 CC ${E.catchCC.length}개: ${E.catchCC.map((c) => `${c.champ} ${c.key}`).join(", ")}`;
      return null;
    },
  };

  function checkVetoes(data, name, A, E) {
    const reasons = [];
    (data.vetoes[name] || []).forEach((v) => {
      if (v.rule) {
        const hit = VETO_RULES[v.rule] && VETO_RULES[v.rule](data, name, A, E);
        if (hit) reasons.push(`${v.why} (${hit})`);
      } else {
        const p = Object.values(E.byLane).find((x) => x.name === v.champ && (!v.lane || x.lane === v.lane));
        if (p) reasons.push(`상대 ${v.lane || p.lane} ${v.champ}: ${v.why}`);
      }
    });
    return reasons;
  }

  // ---------- 2. 점수 ----------

  function dangerTokens(pool) {
    return (pool.dangerCC || "").split(",").map((s) => s.trim()).filter(Boolean);
  }

  function countDangerCC(pool, E) {
    const tokens = dangerTokens(pool);
    if (!tokens.length) tokens.push("확정");
    const hits = [];
    const cc = E.ccList;
    const add = (label, list) => list.forEach((x) => hits.push([`${x.champ} ${x.key}`, label]));
    tokens.forEach((t) => {
      if (t === "광역지연") add(t, cc.filter((c) => c.shape === "광역지연"));
      else if (t === "직선") add(t, cc.filter((c) => c.shape === "직선"));
      else if (t === "확정") add(t, cc.filter((c) => c.shape === "확정"));
      else if (t === "바로 걸리는 확정" || t === "근접 확정") add(t, cc.filter((c) => c.shape === "확정" && !c.dodge));
      else if (t === "근접 광역") add(t, cc.filter((c) => c.shape === "광역즉시"));
      else if (t === "한 명 물기 좋은 스킬") add("한 명 물기", cc.filter((c) => c.target === "단일" && c.use.includes("잡기") && c.shape !== "확정"));
      else if (t === "이동기 봉쇄" || t === "평타 무력화") E.wild.filter((w) => w.type === t).forEach((w) => hits.push([`${w.champ} ${w.skill}`, t]));
    });
    (pool.extraDanger || []).forEach((s) => { if (cc.some((x) => `${x.champ} ${x.key}` === s)) hits.push([s, "직접 지정"]); });
    const seen = new Map();
    hits.forEach(([k, label]) => { if (!seen.has(k)) seen.set(k, label); });
    return [...seen].map(([k, label]) => `${k} (${label})`);
  }

  function scoreChampion(data, name, A, E) {
    const pool = data.pool[name];
    const pick = data.picks[name] || {};
    const me = champ(data, name);
    const myCC = data.cc[name] || [];
    const groups = { 조합: [], 숙련도: [], 대응: [], 상성: [] };
    let score = 0;
    const add = (group, n, text) => { if (!n) return; score += n; groups[group].push({ n: Math.round(n * 10) / 10, text }); };

    // 1. 조합에 필요한 것
    const d = pool.damage;
    const table = {
      AD: { AD: 1, 혼합: 0, AP: -1, AP탱커: -0.25, 반AP: -0.25 },
      AP: { AP: 1, 혼합: -0.25, AD: -1, AP탱커: -0.25, 반AP: 0.25 },
      혼합또는AP: { AP: 1, 혼합: 1, AD: -0.5, AP탱커: -0.25, 반AP: 0.25 },
    };
    const needText = A.need === "혼합또는AP" ? "혼합 딜이나 AP" : A.need;
    const ap = (table[A.need] || {})[d] || 0;
    if (ap > 0) add("조합", ap * W.apMatch, `${needText} 정글이 필요 (${A.why})`);
    else if (ap < 0) add("조합", ap * W.apMismatch, `${needText} 정글이 필요한데 ${d} (${A.why})`);

    if (A.count >= 3) {
      // 탱커 처리: 상대 탱커 기준 (브루저는 % 피해 없이도 잡을 수 있음, 사용자)
      const needAnti = E.tanks.length >= 1 && !A.antiTank.length;
      const pureTank = me.frontline && !me.antiTank && (d.endsWith("탱커") || d === "반AP");
      if (!A.frontline.length && me.frontline)
        add("조합", needAnti && pureTank ? W.needFrontline / 3 : W.needFrontline, "우리 팀에 앞라인이 없음");
      if (!A.engage.length && myCC.some((c) => c.use.includes("이니시"))) add("조합", W.needEngage, "우리 팀에 이니시가 없음");
      if (A.ccList.length <= 2 && myCC.length >= 2) add("조합", W.needCC, `우리 팀 하드 CC가 ${A.ccList.length}개뿐인데 하드 CC ${myCC.length}개`);
      if (needAnti && me.antiTank)
        add("조합", E.tanks.length >= 2 ? W.needAntiTank : W.needAntiTank - 1, `상대 탱커(${E.tanks.join(", ")})를 잡을 딜이 있음`);
      if (needAnti && pureTank) add("조합", -W.pureTankWhenAntiTank, "탱커를 더해도 상대 탱커를 잡을 챔피언이 없음");
      if (A.carries.length <= 1 && !pureTank) add("조합", W.needCarry, "우리 팀에 딜러가 부족함");
    }

    // 2. 숙련도
    add("숙련도", W.prof[pool.prof] || 0, `숙련도 ${pool.prof}`);
    if (pool.rare) add("숙련도", -W.rare, "평소에 자주 안 꺼내는 챔피언");

    // 3. 상대 대응
    if (pool.vuln) {
      const hits = countDangerCC(pool, E);
      const limit = { 높음: 2, 중간: 3, 낮음: 5 }[pool.vuln];
      if (hits.length >= limit) add("대응", -Math.min(W.vulnMax, W.vulnBase + (hits.length - limit)), `CC 취약도 ${pool.vuln}, 위험한 CC ${hits.length}개: ${hits.join(", ")}`);
      else if (hits.length && hits.length === limit - 1) add("대응", -W.vulnNear, `위험한 CC ${hits.length}개: ${hits.join(", ")}`);
    }
    if (me.auto && !dangerTokens(pool).includes("평타 무력화")) {
      const aa = E.wild.filter((w) => w.type === "평타 무력화");
      if (aa.length) add("대응", -Math.min(W.aaNullMax, W.aaNullEach * aa.length), `평타 위주인데 평타 무력화: ${aa.map((w) => `${w.champ} ${w.skill}`).join(", ")}`);
    }
    const when = pick["시점"] || "";
    if (E.count < 3 && /보고/.test(when) && !/빨리|무난/.test(when))
      add("대응", -W.timing, `상대를 보고 고르는 챔피언인데 상대가 ${E.count}명만 나옴`);
    if (ASSASSIN_JUNGLE.includes(name)) {
      const top = E.protectors.filter((p) => p.tier === "최상");
      if (top.length) add("대응", -W.protectorTop, `상대 보호력 최상 서폿: ${top.map((p) => p.name).join(", ")}`);
      if (E.tanks.length >= 2) add("대응", -W.manyTanks, `상대 탱커 ${E.tanks.length}명`);
      if (E.highHp.length) add("대응", -W.highHp, `체력이 매우 높은 탱커: ${E.highHp.join(", ")}`);
    }
    const R = RULES[name];
    if (R) R({ data, A, E, add, pool, me });

    // 4. 상성
    const bad = pick["상성_불리"] || [], good = pick["상성_유리"] || [];
    Object.values(E.byLane).forEach((p) => {
      const jg = p.lane === "정글";
      if (bad.includes(p.name)) add("상성", -(jg ? W.matchJungle : W.matchLane), `불리: ${p.name}${jg ? " (상대 정글)" : ""}`);
      if (good.includes(p.name)) add("상성", jg ? W.matchJungle : W.matchLane, `유리: ${p.name}${jg ? " (상대 정글)" : ""}`);
    });

    return { name, score: Math.round(score * 10) / 10, prof: pool.prof, damage: d, groups };
  }

  // 챔피언별 규칙 (상대 대응 묶음)
  const RULES = {
    "브라이어": ({ E, add }) => {
      if (!E.byLane["미드"] || !E.byLane["원딜"]) add("대응", -2, "상대 미드와 원딜이 나온 뒤에 고르는 챔피언 (아직 안 나옴)");
    },
    "그레이브즈": ({ A, E, add }) => {
      if (A.adcIsMage) add("대응", 3, "우리 원딜이 비원딜이라 원딜 역할을 대신함");
      if (E.allAD && A.count >= 3 && A.carries.length <= 1) add("대응", 2, "상대 전원 AD + 우리 팀 딜러 부족 (E 방어력 중첩)");
    },
    "나피리": ({ E, add }) => {
      if (E.longMobility.length) add("대응", -1.5, `거리가 먼 이동기는 못 따라감: ${E.longMobility.join(", ")}`);
    },
    "녹턴": ({ E, add }) => {
      const adc = E.byLane["원딜"];
      if (!adc) add("대응", -1, "상대 바텀을 보고 고르는 챔피언 (아직 안 나옴)");
      else if (!E.tanks.includes(adc.name)) add("대응", 1, `상대 원딜 ${adc.name}를 R로 노릴 수 있음`);
    },
    "다이애나": ({ A, add }) => {
      if (A.yasuo) add("대응", 3, "우리 편 야스오와 R 에어본 연계");
    },
    "그웬": ({ E, add }) => {
      if (E.tanks.length >= 2) add("대응", 3, `상대 탱커 ${E.tanks.length}명 (최대 체력 % 피해)`);
      if (E.highHp.length) add("대응", 1, `체력 높은 탱커: ${E.highHp.join(", ")}`);
    },
    "피들스틱": ({ E, add }) => {
      if (E.stealth.length) add("대응", 2, `은신 챔피언을 잘 잡음: ${E.stealth.join(", ")}`);
      const kb = E.ccList.filter((c) => /넉백/.test(c.kind));
      if (kb.length) add("대응", -Math.min(3, kb.length), `R을 끊는 넉백: ${kb.map((c) => `${c.champ} ${c.key}`).join(", ")}`);
      const fi = Object.values(E.byLane).filter((p) => FEAR_IGNORE.includes(p.name));
      if (fi.length) add("대응", -fi.length, `공포가 잘 안 통함: ${fi.map((p) => p.name).join(", ")}`);
    },
    "헤카림": ({ E, add }) => {
      if (E.adcIsMage) add("대응", 3, "상대 원딜이 비원딜이라 카이팅이 약함");
    },
    "람머스": ({ E, add }) => {
      if (Object.values(E.byLane).some((p) => p.name === "마스터 이")) add("대응", 5, "상대 마스터 이가 있으면 바로 람머스");
      if (E.adCount >= 4 && E.autoCount >= 3) add("대응", 4, `상대 AD ${E.adCount}명, 평타 위주 ${E.autoCount}명`);
    },
    "말파이트": ({ E, add }) => {
      if (E.allAD && E.autoCount < 3 && E.count >= 3) add("대응", 4, `상대 전원 AD, 평타 위주 ${E.autoCount}명 (람머스 대신)`);
    },
    "사일러스": ({ data, E, add }) => {
      const good = Object.values(E.byLane).filter((p) => champ(data, p.name).sylasUlt);
      if (good.length >= 2) add("대응", 3, `빼앗기 좋은 궁극기 ${good.length}개: ${good.map((p) => p.name).join(", ")}`);
      else if (E.count >= 4) add("대응", -2, "빼앗기 좋은 궁극기가 부족함");
    },
    "바이": ({ E, add }) => {
      if (E.longMobility.length) add("대응", 1, `거리가 먼 이동기도 따라감: ${E.longMobility.join(", ")}`);
    },
    "렉사이": ({ E, add }) => {
      if (E.longMobility.length) add("대응", 1, `거리가 먼 이동기도 따라감: ${E.longMobility.join(", ")}`);
      if (E.stealth.length) add("대응", 1, `진동 감지로 은신을 찾음: ${E.stealth.join(", ")}`);
    },
  };

  function recommend(data, ally, enemy, opts) {
    opts = opts || {};
    const minProf = opts.minProf || 2;
    const bans = new Set(opts.bans || []);
    const taken = new Set([...ally, ...enemy].map((p) => p.name));
    const A = analyzeAlly(data, ally);
    const E = analyzeEnemy(data, enemy);
    A.warnings = allyWarnings(A, E);
    const recs = [], vetoed = [];
    Object.keys(data.pool)
      .filter((n) => data.pool[n].prof >= minProf && !taken.has(n) && !bans.has(n))
      .forEach((n) => {
        const reasons = checkVetoes(data, n, A, E);
        if (reasons.length) vetoed.push({ name: n, prof: data.pool[n].prof, reasons });
        else recs.push(scoreChampion(data, n, A, E));
      });
    recs.sort((a, b) => b.score - a.score || b.prof - a.prof);
    vetoed.sort((a, b) => b.prof - a.prof);
    return { ally: A, enemy: E, recs, vetoed };
  }

  return { recommend, analyzeAlly, analyzeEnemy, dmgOf, LANES, W };
});

</script>
<script>
(function () {
  "use strict";
  const ALLY_LANES = ["탑", "정글", "미드", "원딜", "서폿"];
  const EXAMPLE = {
    ally: { 탑: "가렌", 미드: "제드", 원딜: "징크스", 서폿: "레오나" },
    enemy: { 탑: "피오라", 정글: "마스터 이", 미드: "야스오", 원딜: "베인", 서폿: "파이크" },
    bans: "리 신",
  };
  const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
  const chosung = (s) => [...s].map((ch) => {
    const c = ch.charCodeAt(0) - 0xac00;
    return c >= 0 && c < 11172 ? CHO[Math.floor(c / 588)] : ch;
  }).join("");

  let DATA = null, NAMES = [], showAll = false, isExample = false;
  const state = { ally: {}, enemy: {}, bans: "" };

  const save = () => { try { localStorage.setItem("jungle-draft", JSON.stringify(state)); } catch (e) {} };
  const load = () => { try { return JSON.parse(localStorage.getItem("jungle-draft") || "null"); } catch (e) { return null; } };

  function search(q) {
    q = q.trim().replace(/\s/g, "");
    if (!q) return [];
    return NAMES.filter((n) => {
      const flat = n.replace(/\s/g, "");
      return flat.includes(q) || chosung(flat).includes(q);
    }).slice(0, 8);
  }

  function makeSlot(side, lane) {
    const wrap = document.createElement("div");
    wrap.className = "slot";
    const label = document.createElement("span");
    label.className = "lane";
    label.textContent = lane;
    wrap.appendChild(label);
    if (side === "ally" && lane === "정글") {
      wrap.classList.add("me");
      const me = document.createElement("div");
      me.className = "pick";
      me.textContent = "나 (추천 받을 자리)";
      wrap.appendChild(me);
      return wrap;
    }
    const input = document.createElement("input");
    input.id = `${side}-${lane}`;
    input.placeholder = "챔피언 이름이나 초성";
    input.autocomplete = "off";
    input.setAttribute("aria-label", `${side === "ally" ? "우리" : "상대"} ${lane}`);
    const menu = document.createElement("div");
    menu.className = "menu";
    menu.hidden = true;
    let items = [], active = 0;
    const commit = (name) => {
      input.value = name;
      state[side][lane] = name;
      menu.hidden = true;
      onChange();
    };
    const render = () => {
      menu.innerHTML = "";
      items.forEach((n, i) => {
        const d = document.createElement("div");
        d.textContent = n;
        d.setAttribute("aria-selected", i === active ? "true" : "false");
        d.addEventListener("mousedown", (e) => { e.preventDefault(); commit(n); });
        menu.appendChild(d);
      });
      menu.hidden = items.length === 0;
    };
    input.addEventListener("input", () => {
      items = search(input.value); active = 0; render();
      if (!input.value.trim()) { delete state[side][lane]; onChange(); }
    });
    input.addEventListener("keydown", (e) => {
      if (menu.hidden) return;
      if (e.key === "ArrowDown") { active = Math.min(items.length - 1, active + 1); render(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { active = Math.max(0, active - 1); render(); e.preventDefault(); }
      else if (e.key === "Enter") { if (items[active]) commit(items[active]); e.preventDefault(); }
      else if (e.key === "Escape") { menu.hidden = true; }
    });
    input.addEventListener("blur", () => {
      menu.hidden = true;
      const exact = NAMES.find((n) => n.replace(/\s/g, "") === input.value.trim().replace(/\s/g, ""));
      if (exact) commit(exact);
      else if (input.value.trim() && !NAMES.includes(state[side][lane])) { delete state[side][lane]; onChange(); }
    });
    wrap.appendChild(input);
    wrap.appendChild(menu);
    return wrap;
  }

  function fillInputs() {
    for (const side of ["ally", "enemy"]) for (const lane of ALLY_LANES) {
      const el = document.getElementById(`${side}-${lane}`);
      if (el) el.value = state[side][lane] || "";
    }
    document.getElementById("bans").value = state.bans || "";
    refreshFilled();
  }

  function refreshFilled() {
    document.querySelectorAll(".slot input").forEach((el) => el.classList.toggle("filled", NAMES.includes(el.value)));
  }

  function chip(text, warn) {
    const s = document.createElement("span");
    s.className = "chip" + (warn ? " warn" : "");
    s.textContent = text;
    return s;
  }

  function onChange(fromUser = true) {
    if (fromUser && isExample) { isExample = false; document.getElementById("example-note").hidden = true; }
    refreshFilled();
    save();
    const ally = Object.entries(state.ally).filter(([l, n]) => l !== "정글" && NAMES.includes(n)).map(([lane, name]) => ({ lane, name }));
    const enemy = Object.entries(state.enemy).filter(([, n]) => NAMES.includes(n)).map(([lane, name]) => ({ lane, name }));
    const bans = (state.bans || "").split(/[,\s]+/).map((s) => s.trim()).filter(Boolean)
      .map((b) => NAMES.find((n) => n.replace(/\s/g, "") === b.replace(/\s/g, ""))).filter(Boolean);
    const r = JungleEngine.recommend(DATA, ally, enemy, { bans });

    const needText = { AD: "AD 정글", AP: "AP 정글", 혼합또는AP: "혼합 딜 또는 AP 정글" }[r.ally.need];
    document.getElementById("need").textContent = needText;
    document.getElementById("need-why").textContent = r.ally.why;
    const A = r.ally;
    const aw = document.getElementById("ally-warns"); aw.innerHTML = "";
    A.warnings.forEach((w) => {
      const li = document.createElement("li");
      li.className = { 위험: "w-bad", 주의: "w-warn", 참고: "w-note" }[w.level];
      li.innerHTML = `<b></b> <span></span>`;
      li.querySelector("b").textContent = w.level;
      li.querySelector("span").textContent = w.text;
      aw.appendChild(li);
    });
    if (ally.length > 0 && ally.length < 3) {
      const li = document.createElement("li"); li.className = "w-note";
      li.textContent = "우리 팀이 3명 이상 골라야 부족한 점을 판단해요.";
      aw.appendChild(li);
    }
    const ac = document.getElementById("ally-chips"); ac.innerHTML = "";
    if (ally.length) {
      ac.appendChild(chip(`하드 CC ${A.ccList.length}개`, ally.length >= 3 && A.ccList.length <= 2));
      ["확정", "직선", "광역즉시", "광역지연", "지형"].forEach((s) => { if (A.shapes[s]) ac.appendChild(chip(`${s} ${A.shapes[s]}`)); });
      ac.appendChild(chip(`이니시 ${A.engage.length ? A.engage.map((p) => p.name).join(", ") : "없음"}`, ally.length >= 3 && !A.engage.length));
      ac.appendChild(chip(`앞라인 ${A.frontline.length ? A.frontline.map((p) => p.name).join(", ") : "없음"}`, ally.length >= 3 && !A.frontline.length));
      ac.appendChild(chip(`탱커 처리 ${A.antiTank.length ? A.antiTank.map((p) => p.name).join(", ") : "없음"}`, ally.length >= 3 && !A.antiTank.length && r.enemy.tanks.length >= 1));
      ac.appendChild(chip(`딜러 ${A.carries.length}명`, ally.length >= 3 && A.carries.length <= 1));
      const d = A.dmgCount;
      ac.appendChild(chip(`AD ${d.AD} · AP ${d.AP}${d.혼합 ? ` · 혼합 ${d.혼합}` : ""}${d.탱커 ? ` · 탱커 ${d.탱커}` : ""}`));
      if (A.auto.length) ac.appendChild(chip(`평타 위주 ${A.auto.length}명`));
    }

    const ec = document.getElementById("enemy-chips"); ec.innerHTML = "";
    const E = r.enemy;
    if (!enemy.length) ec.appendChild(chip("아직 상대가 없어요"));
    else {
      ec.appendChild(chip(`${E.count}명 공개`));
      ec.appendChild(chip(`AD ${E.adCount}명`, E.adCount >= 4));
      ec.appendChild(chip(`평타 위주 ${E.autoCount}명`, E.autoCount >= 3));
      if (E.tanks.length) ec.appendChild(chip(`탱커 ${E.tanks.join(", ")}`, E.tanks.length >= 2));
      if (E.frontline.length) ec.appendChild(chip(`앞라인 ${E.frontline.join(", ")}`));
      if (E.assassins.length || E.duelists.length) ec.appendChild(chip(`암살·1:1 강자 ${[...new Set([...E.assassins, ...E.duelists])].join(", ")}`));
      const order = ["확정", "직선", "광역즉시", "광역지연", "지형"];
      order.forEach((s) => { if (E.shapes[s]) ec.appendChild(chip(`${s} CC ${E.shapes[s]}`, s === "확정" && E.shapes[s] >= 3)); });
      E.protectors.forEach((p) => ec.appendChild(chip(`보호 ${p.name} (${p.tier})`, p.tier === "최상")));
      if (E.stealth.length) ec.appendChild(chip(`은신 ${E.stealth.join(", ")}`));
      if (E.adcIsMage) ec.appendChild(chip("상대 원딜이 비원딜"));
      E.wild.forEach((w) => ec.appendChild(chip(`${w.champ} ${w.skill}: ${w.type}`)));
    }

    const box = document.getElementById("recs"); box.innerHTML = "";
    const list = showAll ? r.recs : r.recs.slice(0, 6);
    const max = Math.max(1, ...r.recs.map((x) => x.score));
    list.forEach((x, i) => {
      const card = document.createElement("article");
      card.className = "rec" + (i < 3 ? " top" : "");
      const pct = Math.max(0, Math.min(100, (x.score / max) * 100));
      card.innerHTML = `<div class="rank">${i + 1}</div>
        <div class="rec-head"><span class="rec-name"></span>
          <span class="score ${x.score >= 0 ? "pos" : "neg"}">${x.score > 0 ? "+" : ""}${x.score}</span>
          <span class="meta">숙련도 ${x.prof} · ${x.damage}</span></div>
        <div class="bar"><span style="width:${pct}%"></span></div>
        <ul class="reasons"></ul>`;
      card.querySelector(".rec-name").textContent = x.name;
      const ul = card.querySelector(".reasons");
      Object.entries(x.groups).forEach(([g, items]) => items.forEach((it) => {
        const li = document.createElement("li");
        li.className = it.n > 0 ? "p" : "m";
        li.innerHTML = `<span class="grp"></span><span class="pts"></span> <span class="txt"></span>`;
        li.querySelector(".grp").textContent = g;
        li.querySelector(".pts").textContent = `${it.n > 0 ? "+" : ""}${it.n}`;
        li.querySelector(".txt").textContent = it.text;
        ul.appendChild(li);
      }));
      if (!ul.children.length) { const li = document.createElement("li"); li.className = "n"; li.textContent = "특별한 장단점 없음"; ul.appendChild(li); }
      box.appendChild(card);
    });
    if (!r.recs.length) box.innerHTML = '<p class="empty">추천할 챔피언이 없어요.</p>';

    const vbox = document.getElementById("vetoed"); vbox.innerHTML = "";
    document.getElementById("vetoed-sec").hidden = !r.vetoed.length;
    r.vetoed.forEach((v) => {
      const row = document.createElement("div");
      row.className = "veto";
      row.innerHTML = `<b></b><span class="meta"></span><ul></ul>`;
      row.querySelector("b").textContent = v.name;
      row.querySelector(".meta").textContent = `숙련도 ${v.prof}`;
      v.reasons.forEach((t) => { const li = document.createElement("li"); li.textContent = t; row.querySelector("ul").appendChild(li); });
      vbox.appendChild(row);
    });
    const more = document.getElementById("btn-more");
    more.hidden = r.recs.length <= 6;
    more.textContent = showAll ? "상위 6명만 보기" : `나머지 ${r.recs.length - 6}명 보기`;
  }

  function setExample() {
    state.ally = { ...EXAMPLE.ally }; state.enemy = { ...EXAMPLE.enemy }; state.bans = EXAMPLE.bans;
    isExample = true; document.getElementById("example-note").hidden = false;
    fillInputs(); onChange(false);
  }

  async function start() {
    const res = await fetch("data.json");
    DATA = await res.json();
    NAMES = Object.keys(DATA.champions).sort((a, b) => a.localeCompare(b, "ko"));
    const ally = document.getElementById("ally"), enemy = document.getElementById("enemy");
    ALLY_LANES.forEach((l) => { ally.appendChild(makeSlot("ally", l)); enemy.appendChild(makeSlot("enemy", l)); });
    document.getElementById("bans").addEventListener("input", (e) => { state.bans = e.target.value; onChange(); });
    document.getElementById("btn-example").addEventListener("click", setExample);
    document.getElementById("btn-clear").addEventListener("click", () => {
      state.ally = {}; state.enemy = {}; state.bans = ""; isExample = false;
      document.getElementById("example-note").hidden = true; fillInputs(); onChange(false);
    });
    document.getElementById("btn-more").addEventListener("click", () => { showAll = !showAll; onChange(false); });
    const saved = load();
    if (saved && (Object.keys(saved.ally || {}).length || Object.keys(saved.enemy || {}).length)) {
      Object.assign(state, saved); fillInputs(); onChange(false);
    } else setExample();
    if (["localhost", "127.0.0.1"].includes(location.hostname)) startLive();
  }

  // ---------- 롤 클라이언트 자동 채우기 (tools/live_helper.py로 내 컴퓨터에서 열었을 때만) ----------

  const norm = (s) => (s || "").replace(/\s/g, "");
  const toName = (s) => NAMES.find((n) => norm(n) === norm(s)) || null;

  // 상대 포지션 추정: 챔피언의 주 라인 순서로 점수를 매겨 가장 그럴듯하게 배치
  function guessLanes(names, lanes) {
    let best = null, bestScore = -1;
    const fit = (n, lane) => {
      const ls = (DATA.champions[n] || {}).lanes || [];
      const i = ls.indexOf(lane);
      return i < 0 ? 0 : 3 - Math.min(i, 2);
    };
    const go = (i, used, acc, score) => {
      if (i === names.length) { if (score > bestScore) { bestScore = score; best = acc.slice(); } return; }
      lanes.forEach((l) => {
        if (used.has(l)) return;
        used.add(l); acc.push(l);
        go(i + 1, used, acc, score + fit(names[i], l));
        used.delete(l); acc.pop();
      });
    };
    go(0, new Set(), [], 0);
    const out = {};
    (best || []).forEach((l, i) => (out[l] = names[i]));
    return out;
  }

  let lastSig = "";
  function applyDraft(d) {
    const ally = {}, unplaced = [];
    d.ally.forEach((p) => {
      const n = toName(p.name);
      if (!n) return;
      if (p.position && p.position !== "정글" && !ally[p.position]) ally[p.position] = n;
      else unplaced.push(n);
    });
    Object.assign(ally, guessLanes(unplaced, ["탑", "미드", "원딜", "서폿"].filter((l) => !ally[l])));
    const enemyNames = d.enemy.map(toName).filter(Boolean);
    state.ally = ally;
    state.enemy = guessLanes(enemyNames, ALLY_LANES);
    state.bans = d.bans.map(toName).filter(Boolean).join(", ");
    isExample = false; document.getElementById("example-note").hidden = true;
    fillInputs(); onChange(false);
  }

  function startLive() {
    const box = document.getElementById("live"), text = document.getElementById("live-text");
    const toggle = document.getElementById("live-on");
    box.hidden = false;
    const tick = async () => {
      try {
        const res = await fetch("api/draft", { cache: "no-store" });
        const d = await res.json();
        box.classList.toggle("on", d.status === "champ_select");
        if (d.status === "no_client") text.textContent = "롤 클라이언트를 찾지 못했어요. 클라이언트를 켜면 자동으로 연결돼요.";
        else if (d.status !== "champ_select") text.textContent = "롤 클라이언트 연결됨. 밴픽에 들어가면 자동으로 채워져요.";
        else {
          const note = d.myPosition && d.myPosition !== "정글" ? ` (내 포지션: ${d.myPosition}. 추천은 정글 기준이에요)` : "";
          text.textContent = `밴픽 진행 중: 상대 ${d.enemy.length}명 공개${note}. 상대 포지션은 추정이라 틀리면 직접 고쳐 주세요.`;
          const sig = JSON.stringify(d);
          if (toggle.checked && sig !== lastSig) { lastSig = sig; applyDraft(d); }
        }
      } catch (e) {
        text.textContent = "도우미 프로그램과 연결이 끊겼어요. live_helper.py가 실행 중인지 확인해 주세요.";
        box.classList.remove("on");
      }
      setTimeout(tick, 1500);
    };
    toggle.addEventListener("change", () => { lastSig = ""; });
    tick();
  }
  start().catch((e) => {
    document.getElementById("recs").innerHTML = '<p class="empty">데이터를 불러오지 못했어요. 페이지를 새로고침해 주세요.</p>';
    console.error(e);
  });
})();
</script>
